name: Build Admin App Android (Debug)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dentist_booking_admin_app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          FULL="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          if [[ -z "$FULL" ]]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          SEMVER="${FULL%%+*}"
          BUILD="${FULL#*+}"
          if [[ "$BUILD" == "$FULL" ]]; then BUILD="0"; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Version: $FULL (semver: $SEMVER, build: $BUILD)"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Write .env from secrets
        env:
          URL_SUPABASE: ${{ secrets.URL_SUPABASE }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [[ -z "$URL_SUPABASE" || -z "$SUPABASE_KEY" ]]; then
            echo "Missing repository secrets URL_SUPABASE and/or SUPABASE_KEY." >&2
            exit 1
          fi
          printf 'URL_SUPABASE=%s\nSUPABASE_KEY=%s\n' "$URL_SUPABASE" "$SUPABASE_KEY" > .env

      - name: Build debug APK
        run: |
          flutter pub get
          flutter build apk --debug \
            --dart-define=URL_SUPABASE="${{ secrets.URL_SUPABASE }}" \
            --dart-define=SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}"

      - name: Copy versioned APK to dist
        run: |
          VERSION_FULL="${{ steps.version.outputs.full }}"
          APK_SRC="build/app/outputs/flutter-apk/app-debug.apk"
          if [[ ! -f "$APK_SRC" ]]; then
            echo "APK not found at $APK_SRC" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK_SRC" "dist/dentist_booking_admin_app_v${VERSION_FULL}-debug.apk"
          ls -lh dist/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dentist_booking_admin_app-v${{ steps.version.outputs.semver }}-${{ steps.version.outputs.build }}-debug
          path: dentist_booking_admin_app/dist/*.apk
          if-no-files-found: error
          retention-days: 30
