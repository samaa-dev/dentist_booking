name: supabase-backup

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight

env:
  BACKUP_ENABLED: true

jobs:
  run_db_backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}

    steps:
      - name: Check if backups are enabled
        run: |
          if [ "$BACKUP_ENABLED" != "true" ]; then
            echo "Backups are disabled. Exiting workflow."
            exit 0
          fi

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate timestamp for backup
        id: timestamp
        run: echo "BACKUP_TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Create backup directory with timestamp
        run: mkdir -p backup/${{ env.BACKUP_TIMESTAMP }}

      - name: Backup roles
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/${{ env.BACKUP_TIMESTAMP }}/roles_${{ env.BACKUP_TIMESTAMP }}.sql --role-only

      - name: Backup schema
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/${{ env.BACKUP_TIMESTAMP }}/schema_${{ env.BACKUP_TIMESTAMP }}.sql

      - name: Backup data
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/${{ env.BACKUP_TIMESTAMP }}/data_${{ env.BACKUP_TIMESTAMP }}.sql --data-only --use-copy

      - name: Pull latest changes to avoid push conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Commit backups
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Supabase backup - ${{ env.BACKUP_TIMESTAMP }}"
