name: Build TV Android Release

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dentist_booking_tv

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          FULL="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          if [[ -z "$FULL" ]]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          SEMVER="${FULL%%+*}"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "Version: $FULL (semver: $SEMVER)"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Write .env from secrets
        env:
          URL_SUPABASE: ${{ secrets.URL_SUPABASE }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [[ -z "$URL_SUPABASE" || -z "$SUPABASE_KEY" ]]; then
            echo "Missing repository secrets URL_SUPABASE and/or SUPABASE_KEY." >&2
            exit 1
          fi
          printf 'URL_SUPABASE=%s\nSUPABASE_KEY=%s\n' "$URL_SUPABASE" "$SUPABASE_KEY" > .env

      - name: Build TV APK
        run: |
          flutter pub get
          bash scripts/build_tv_apk.sh

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: dentist_booking_tv-v${{ steps.version.outputs.semver }}
          path: dentist_booking_tv/dist/*.apk
          if-no-files-found: error
          retention-days: 30
