# flutter pub run flutter_launcher_icons
flutter_icons:
  android: "launcher_icon" # Set to true to generate for Android
  ios: true # Set to true to generate for iOS
  image_path: "assets/icon/icon.png" # Path to your icon image (PNG format, recommended size 512x512 to 1024x1024)
  windows:
    source_icon: "assets/icon/icon.png"
    # Optional: Set an icon file path with .ico extension
    # icns_path: "assets/icon/icon.ico"
  macos:
    source_icon: "assets/icon/icon.png"
    # Optional: Set an icon file path with .icns extension
    # icns_path: "assets/icon/icon.icns"
